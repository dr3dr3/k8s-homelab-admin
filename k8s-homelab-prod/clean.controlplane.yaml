version: v1alpha1
debug: false
persist: true
machine:
  type: controlplane
  token: op://k8s-homelab-prod/controlplane.machine.token.k8s-homelab-prod/notes
  ca:
    crt: op://k8s-homelab-prod/controlplane.machine.ca.crt.k8s-homelab-prod/notes
    key: op://k8s-homelab-prod/controlplane.machine.ca.key.k8s-homelab-prod/notes
  certSANs: []
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.33.2
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
  network: {}
  install:
    disk: /dev/mmcblk1
    image: factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.10.5
    wipe: true
  registries: {}
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: ""
cluster:
  id: op://k8s-homelab-prod/controlplane.cluster.id.k8s-homelab-prod/notes
  secret: op://k8s-homelab-prod/controlplane.cluster.secret.k8s-homelab-prod/notes
  controlPlane:
    endpoint: https://192.168.8.174:6443
  clusterName: k8s-homelab-prod
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  token: op://k8s-homelab-prod/controlplane.cluster.token.k8s-homelab-prod/notes
  secretboxEncryptionSecret: op://k8s-homelab-prod/controlplane.cluster.secretbox.k8s-homelab-prod/notes
  ca:
    crt: op://k8s-homelab-prod/controlplane.cluster.ca.crt.k8s-homelab-prod/notes
    key: op://k8s-homelab-prod/controlplane.cluster.ca.key.k8s-homelab-prod/notes
  aggregatorCA:
    crt: op://k8s-homelab-prod/controlplane.cluster.aggregatorCA.crt.k8s-homelab-prod/notes
    key: op://k8s-homelab-prod/controlplane.cluster.aggregatorCA.key.k8s-homelab-prod/notes
  serviceAccount:
    key: op://k8s-homelab-prod/controlplane.cluster.service-account.k8s-homelab-prod/notes
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.33.2
    certSANs:
      - 192.168.8.174
    disablePodSecurityPolicy: true
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          defaults:
            audit: restricted
            audit-version: latest
            enforce: baseline
            enforce-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            namespaces:
              - kube-system
            runtimeClasses: []
            usernames: []
          kind: PodSecurityConfiguration
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.33.2
  proxy:
    image: registry.k8s.io/kube-proxy:v1.33.2
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.33.2
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
  etcd:
    ca:
      crt: op://k8s-homelab-prod/controlplane.cluster.etcd.ca.crt.k8s-homelab-prod/notes
      key: op://k8s-homelab-prod/controlplane.cluster.etcd.ca.key.k8s-homelab-prod/notes
  extraManifests: []
  inlineManifests: []
