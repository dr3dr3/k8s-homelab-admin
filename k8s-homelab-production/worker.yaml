version: v1alpha1
debug: false
persist: true
machine:
  type: worker
  token: op://homelab/k8s-homelab-production.worker.machine.token/notes
  ca:
    crt: op://homelab/k8s-homelab-production.worker.machine.ca.crt/notes
    key: ''
  certSANs: []
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.33.2
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
  network: {}
  install:
    disk: /dev/sda
    image: factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.11.5
    wipe: false
  registries: {}
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
cluster:
  id: op://homelab/k8s-homelab-production.worker.cluster.id/notes
  secret: op://homelab/k8s-homelab-production.worker.cluster.secret/notes
  controlPlane:
    endpoint: op://homelab/k8s-homelab-production.talos.api.endpoint/notes
  clusterName: k8s-homelab-production
  network:
    dnsDomain: cluster.local
    podSubnets:
    - 10.244.0.0/16
    serviceSubnets:
    - 10.96.0.0/12
  token: op://homelab/k8s-homelab-production.worker.cluster.token/notes
  ca:
    crt: op://homelab/k8s-homelab-production.worker.cluster.ca.crt/notes
    key: ''
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
