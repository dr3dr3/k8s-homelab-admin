apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: base

# Add common labels to all resources
labels:
  - pairs:
      managed-by: kustomize
      app.kubernetes.io/version: "1.0"

# Add common annotations to all resources (optional)
commonAnnotations:
  docs: "See /workspace/k8s-manifests/README.md"

# List all resources in the base
resources:
  - podinfo/

# Configure the image tags (optional)
# images:
#   - name: my-app
#     newTag: latest

# Uncomment and add resources as you create them
