apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: production

# Reference the base manifests
bases:
  - ../../base

# Add production-specific labels
commonLabels:
  environment: production
  tier: prod

# Add production-specific annotations
commonAnnotations:
  deployment.environment: production

# Apply strategic merge patches for production overrides
# patchesStrategicMerge:
#   - patches/deployment-patch.yaml
#   - patches/ingress-patch.yaml

# Update image tags for production
# images:
#   - name: my-app
#     newTag: v1.0.0

# Configure replicas for production (high availability)
# replicas:
#   - name: my-app
#     count: 3

# Namespace for production
# namespace: production

# ConfigMap/Secret generators for production-specific config
# configMapGenerator:
