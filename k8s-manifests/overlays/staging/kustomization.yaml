apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: staging

# Reference the base manifests
bases:
  - ../../base

# Add staging-specific labels
commonLabels:
  environment: staging
  tier: staging

# Add staging-specific annotations
commonAnnotations:
  deployment.environment: staging

