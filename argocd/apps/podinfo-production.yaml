apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-production
  namespace: argocd
  # Finalizer ensures proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Labels for organization
  labels:
    app: podinfo
    environment: production
spec:
  # Project this application belongs to
  project: homelab

  # Source repository configuration
  source:
    repoURL: https://github.com/dr3dr3/k8s-homelab-admin.git
    targetRevision: main
    path: k8s-manifests/overlays/production/podinfo

  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  # Sync policy configuration
  syncPolicy:
    # Automated sync on git changes
    automated:
      # Automatically delete resources that are removed from git
      prune: true
      # Automatically revert manual changes (self-healing)
      selfHeal: true
      # Allow deletion of resources that are no longer defined
      allowEmpty: false

    # Sync options
    syncOptions:
      # Create namespace if it doesn't exist
      - CreateNamespace=true
      # Validate resources before applying
      - Validate=true
      # Use server-side apply (recommended for production)
      - ServerSideApply=true
      # Prune last to avoid dependency issues
      - PruneLast=true

    # Retry configuration for failed syncs
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in certain fields (optional)
  ignoreDifferences:
    # Example: ignore replicas if using HPA
    # - group: apps
    #   kind: Deployment
    #   jsonPointers:
    #     - /spec/replicas

  # Health assessment configuration
  # (ArgoCD will wait for these conditions before marking as healthy)
  # This is usually automatic, but can be customized
